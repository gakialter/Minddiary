name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify release tag and notes version
        shell: pwsh
        run: |
          $packageVersion = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          $expectedTag = "v$packageVersion"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Release tag $env:GITHUB_REF_NAME does not match package.json version $expectedTag"
          }

          $releaseNotesTitle = Get-Content -LiteralPath RELEASE_NOTES.md -TotalCount 1
          if ($releaseNotesTitle -ne "# MindDiary $expectedTag") {
            throw "RELEASE_NOTES.md title '$releaseNotesTitle' does not match # MindDiary $expectedTag"
          }

      - name: Check Windows signing configuration
        shell: pwsh
        env:
          HAS_CSC_LINK: ${{ secrets.CSC_LINK != '' }}
          HAS_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD != '' }}
        run: |
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "### Windows signing preflight"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ""

          if ($env:HAS_CSC_LINK -eq 'true' -and $env:HAS_CSC_KEY_PASSWORD -eq 'true') {
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "Signing secrets configured: true"
            Add-Content -LiteralPath $env:GITHUB_ENV -Value "WINDOWS_REQUIRE_SIGNED=true"
          } elseif ($env:HAS_CSC_LINK -eq 'false' -and $env:HAS_CSC_KEY_PASSWORD -eq 'false') {
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "Signing secrets configured: false"
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ""
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "> Windows artifacts will be unsigned. Users can see Unknown Publisher and SmartScreen warnings."
            Write-Host "::warning::Windows signing secrets are not configured. Continuing with unsigned Windows artifacts."
            Add-Content -LiteralPath $env:GITHUB_ENV -Value "WINDOWS_REQUIRE_SIGNED=false"
          } else {
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "Signing secrets configured: partial"
            throw "CSC_LINK and CSC_KEY_PASSWORD must be configured together, or both omitted for an unsigned Windows release."
          }

      - name: Build Electron
        run: npm run build:electron

      - name: Build web app
        run: npx vite build

      - name: Prepare build resources
        run: npm run build:resources

      - name: Rebuild native dependencies for Electron
        run: npm run rebuild:electron

      - name: Verify Electron native dependencies
        run: npm run verify:electron-native

      - name: Package Windows build
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: npx electron-builder --win --x64 --publish never

      - name: Verify packaged Electron security policy
        run: npm run verify:electron-package-security:release

      - name: Verify packaged Electron native dependencies
        run: npm run verify:electron-native:packaged

      - name: Run packaged application security smoke
        run: npm run test:e2e:packaged-security

      - name: Run Windows Portable packaged smoke
        run: npm run test:e2e:portable-smoke

      - name: Upload Windows Portable smoke evidence
        uses: actions/upload-artifact@v6
        with:
          name: windows-portable-smoke-evidence
          path: test-results/windows-portable-smoke-evidence/*
          if-no-files-found: error
          retention-days: 14

      - name: Run Windows packaged ASAR integrity negative tests
        run: npm run test:asar-integrity:packaged

      - name: Verify Windows signing
        shell: pwsh
        run: |
          $requireSigned = [System.Convert]::ToBoolean($env:WINDOWS_REQUIRE_SIGNED)
          ./scripts/verify-windows-signing.ps1 -ReleaseDir release -RequireSigned:$requireSigned

      - name: Verify Windows update metadata
        run: npx tsx scripts/verify-release-metadata.ts --platform win --release-dir release --package package.json

      - name: Stage Windows release assets
        run: node scripts/prepare-release-assets.mjs --platform win --source release --output release-upload --package package.json

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v6
        with:
          name: windows-release
          path: release-upload/*
          if-no-files-found: error

  build-mac:
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify release tag and notes version
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          EXPECTED_TAG="v${PACKAGE_VERSION}"
          if [ "$GITHUB_REF_NAME" != "$EXPECTED_TAG" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match package.json version $EXPECTED_TAG" >&2
            exit 1
          fi

          RELEASE_NOTES_TITLE="$(head -n 1 RELEASE_NOTES.md)"
          if [ "$RELEASE_NOTES_TITLE" != "# MindDiary $EXPECTED_TAG" ]; then
            echo "RELEASE_NOTES.md title '$RELEASE_NOTES_TITLE' does not match # MindDiary $EXPECTED_TAG" >&2
            exit 1
          fi

      - name: Build Electron
        run: npm run build:electron

      - name: Build web app
        run: npx vite build

      - name: Prepare build resources
        run: npm run build:resources

      - name: Confirm macOS ARM64 runner
        run: node -e "if (process.arch !== 'arm64') throw new Error('Expected macOS ARM64 runner, got ' + process.arch)"

      - name: Rebuild native dependencies for Electron
        run: npm run rebuild:electron

      - name: Verify Electron native dependencies
        run: npm run verify:electron-native

      - name: Package macOS arm64 build
        run: npx electron-builder --mac --arm64 --publish never

      - name: Verify packaged Electron security policy
        run: npm run verify:electron-package-security:release

      - name: Verify packaged Electron native dependencies
        run: npm run verify:electron-native:packaged

      - name: Run packaged application security smoke
        run: npm run test:e2e:packaged-security

      - name: Verify macOS package code integrity
        run: codesign --verify --deep --strict --verbose=2 release/mac-arm64/MindDiary.app

      - name: Verify macOS update metadata
        run: npx tsx scripts/verify-release-metadata.ts --platform mac --release-dir release --package package.json

      - name: Stage macOS release assets
        run: node scripts/prepare-release-assets.mjs --platform mac --source release --output release-upload --package package.json

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v6
        with:
          name: mac-release
          path: release-upload/*
          if-no-files-found: error

  publish:
    needs:
      - build-windows
      - build-mac

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Verify release tag and notes version
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          EXPECTED_TAG="v${PACKAGE_VERSION}"
          if [ "$GITHUB_REF_NAME" != "$EXPECTED_TAG" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match package.json version $EXPECTED_TAG" >&2
            exit 1
          fi

          RELEASE_NOTES_TITLE="$(head -n 1 RELEASE_NOTES.md)"
          if [ "$RELEASE_NOTES_TITLE" != "# MindDiary $EXPECTED_TAG" ]; then
            echo "RELEASE_NOTES.md title '$RELEASE_NOTES_TITLE' does not match # MindDiary $EXPECTED_TAG" >&2
            exit 1
          fi

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-artifacts
          pattern: '*-release'
          merge-multiple: true

      - name: Verify release asset manifest
        run: node scripts/prepare-release-assets.mjs --platform all --source release-artifacts --package package.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          body_path: RELEASE_NOTES.md
          files: release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
