name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify release tag and notes version
        shell: pwsh
        run: |
          $packageVersion = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          $expectedTag = "v$packageVersion"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Release tag $env:GITHUB_REF_NAME does not match package.json version $expectedTag"
          }

          $releaseNotesTitle = Get-Content -LiteralPath RELEASE_NOTES.md -TotalCount 1
          if ($releaseNotesTitle -ne "# MindDiary $expectedTag") {
            throw "RELEASE_NOTES.md title '$releaseNotesTitle' does not match # MindDiary $expectedTag"
          }

      - name: Check Windows signing secrets
        shell: pwsh
        env:
          WINDOWS_SIGNING_CONFIGURED: ${{ secrets.CSC_LINK != '' && secrets.CSC_KEY_PASSWORD != '' }}
        run: |
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "### Windows signing preflight"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ""
          if ($env:WINDOWS_SIGNING_CONFIGURED -ne 'true') {
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "Signing secrets configured: false"
            throw "CSC_LINK and CSC_KEY_PASSWORD are required for public Windows release signing."
          } else {
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "Signing secrets configured: true"
          }

      - name: Build Electron
        run: npm run build:electron

      - name: Build web app
        run: npx vite build

      - name: Prepare build resources
        run: npm run build:resources

      - name: Package Windows build
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: npx electron-builder --win --x64 --publish never

      - name: Verify Windows signing
        shell: pwsh
        run: ./scripts/verify-windows-signing.ps1 -ReleaseDir release -RequireSigned:$true

      - name: Verify Windows update metadata
        run: npx tsx scripts/verify-release-metadata.ts --platform win --release-dir release --package package.json

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            release/**/*.exe
            release/**/*.exe.blockmap
            release/latest.yml
          if-no-files-found: error

  build-mac:
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify release tag and notes version
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          EXPECTED_TAG="v${PACKAGE_VERSION}"
          if [ "$GITHUB_REF_NAME" != "$EXPECTED_TAG" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match package.json version $EXPECTED_TAG" >&2
            exit 1
          fi

          RELEASE_NOTES_TITLE="$(head -n 1 RELEASE_NOTES.md)"
          if [ "$RELEASE_NOTES_TITLE" != "# MindDiary $EXPECTED_TAG" ]; then
            echo "RELEASE_NOTES.md title '$RELEASE_NOTES_TITLE' does not match # MindDiary $EXPECTED_TAG" >&2
            exit 1
          fi

      - name: Build Electron
        run: npm run build:electron

      - name: Build web app
        run: npx vite build

      - name: Prepare build resources
        run: npm run build:resources

      - name: Package macOS arm64 build
        run: npx electron-builder --mac --arm64 --publish never

      - name: Verify macOS update metadata
        run: npx tsx scripts/verify-release-metadata.ts --platform mac --release-dir release --package package.json

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-release
          path: |
            release/**/*.dmg
            release/**/*.zip
            release/**/*.blockmap
            release/latest-mac.yml
          if-no-files-found: error

  publish:
    needs:
      - build-windows
      - build-mac

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify release tag and notes version
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          EXPECTED_TAG="v${PACKAGE_VERSION}"
          if [ "$GITHUB_REF_NAME" != "$EXPECTED_TAG" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match package.json version $EXPECTED_TAG" >&2
            exit 1
          fi

          RELEASE_NOTES_TITLE="$(head -n 1 RELEASE_NOTES.md)"
          if [ "$RELEASE_NOTES_TITLE" != "# MindDiary $EXPECTED_TAG" ]; then
            echo "RELEASE_NOTES.md title '$RELEASE_NOTES_TITLE' does not match # MindDiary $EXPECTED_TAG" >&2
            exit 1
          fi

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          body_path: RELEASE_NOTES.md
          files: |
            release-artifacts/**/*.exe
            release-artifacts/**/*.exe.blockmap
            release-artifacts/latest.yml
            release-artifacts/**/*.dmg
            release-artifacts/**/*.zip
            release-artifacts/**/*.blockmap
            release-artifacts/latest-mac.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
