name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check Windows signing secrets
        shell: pwsh
        env:
          WINDOWS_SIGNING_CONFIGURED: ${{ secrets.CSC_LINK != '' && secrets.CSC_KEY_PASSWORD != '' }}
        run: |
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "### Windows signing preflight"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ""
          if ($env:WINDOWS_SIGNING_CONFIGURED -ne 'true') {
            $message = "CSC_LINK and CSC_KEY_PASSWORD must be configured before publishing a public Windows release."
            Write-Host "::error::$message"
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "Signing secrets configured: false"
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ""
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "Unsigned installers can show Unknown Publisher and Windows SmartScreen warnings. Configure the secrets before pushing a release tag."
            exit 1
          }
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "Signing secrets configured: true"

      - name: Build Electron
        run: npm run build:electron

      - name: Build web app
        run: npx vite build

      - name: Prepare build resources
        run: npm run build:resources

      - name: Package Windows build
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: npx electron-builder --win --x64 --publish never

      - name: Verify Windows signing
        shell: pwsh
        env:
          WINDOWS_SIGNING_CONFIGURED: ${{ secrets.CSC_LINK != '' && secrets.CSC_KEY_PASSWORD != '' }}
        run: ./scripts/verify-windows-signing.ps1 -ReleaseDir release -RequireSigned:($env:WINDOWS_SIGNING_CONFIGURED -eq 'true')

      - name: Verify Windows update metadata
        run: npx tsx scripts/verify-release-metadata.ts --platform win --release-dir release --package package.json

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            release/**/*.exe
            release/**/*.exe.blockmap
            release/latest.yml
          if-no-files-found: error

  build-mac:
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Electron
        run: npm run build:electron

      - name: Build web app
        run: npx vite build

      - name: Prepare build resources
        run: npm run build:resources

      - name: Package macOS arm64 build
        run: npx electron-builder --mac --arm64 --publish never

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-release
          path: |
            release/**/*.dmg
            release/**/*.zip
            release/**/*.blockmap
            release/latest-mac.yml
          if-no-files-found: error

  publish:
    needs:
      - build-windows
      - build-mac

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            release-artifacts/**/*.exe
            release-artifacts/**/*.exe.blockmap
            release-artifacts/latest.yml
            release-artifacts/**/*.dmg
            release-artifacts/**/*.zip
            release-artifacts/**/*.blockmap
            release-artifacts/latest-mac.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
