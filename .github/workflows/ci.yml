name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Rebuild SQLite for Node tests
        run: npm rebuild better-sqlite3

      - name: Type check
        run: npm run typecheck

      - name: Run unit tests
        run: npx vitest run

      - name: Build verification
        run: |
          npm run build:electron
          npx vite build

      - name: Rebuild native dependency for Electron E2E
        run: npm run rebuild:electron

      - name: Run source-tree Electron E2E
        run: npm run test:e2e

  build-verification:
    strategy:
      matrix:
        os: [windows-latest, macos-14]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Electron
        run: npm run build:electron

      - name: Build web app
        run: npx vite build

      - name: Prepare build resources
        run: npm run build:resources

      - name: Confirm macOS ARM64 runner
        if: matrix.os == 'macos-14'
        run: node -e "if (process.arch !== 'arm64') throw new Error('Expected macOS ARM64 runner, got ' + process.arch)"

      - name: Rebuild native dependencies for Electron
        run: npm run rebuild:electron

      - name: Verify Electron native dependencies
        run: npm run verify:electron-native

      - name: Package Windows Setup and Portable for verification
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win nsis portable --x64 --publish never

      - name: Package macOS ARM64 app for native verification
        if: matrix.os == 'macos-14'
        run: npx electron-builder --dir --mac --arm64 --publish never

      - name: Verify packaged Electron security policy
        run: npm run verify:electron-package-security

      - name: Verify packaged Electron native dependencies
        run: npm run verify:electron-native:packaged

      - name: Run packaged application security smoke
        run: npm run test:e2e:packaged-security

      - name: Run Windows Portable packaged smoke
        if: matrix.os == 'windows-latest'
        run: npm run test:e2e:portable-smoke

      - name: Upload Windows Portable smoke evidence
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v6
        with:
          name: windows-portable-smoke-${{ github.event.pull_request.head.sha || github.sha }}
          path: test-results/windows-portable-smoke-evidence/*
          if-no-files-found: error
          retention-days: 14

      - name: Run Windows Setup install and uninstall smoke
        if: matrix.os == 'windows-latest'
        run: npm run test:e2e:setup-smoke

      - name: Upload Windows Setup smoke evidence
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v6
        with:
          name: windows-setup-smoke-${{ github.event.pull_request.head.sha || github.sha }}
          path: test-results/windows-setup-smoke-evidence/*
          if-no-files-found: error
          retention-days: 14

      - name: Run Windows packaged ASAR integrity negative tests
        if: matrix.os == 'windows-latest'
        run: npm run test:asar-integrity:packaged

      - name: Verify macOS ad-hoc code integrity
        if: matrix.os == 'macos-14'
        shell: bash
        run: |
          set -euo pipefail
          app_path="release/mac-arm64/MindDiary.app"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          signature_info="$(codesign -dv --verbose=4 "$app_path" 2>&1)"
          echo "$signature_info"
          echo "$signature_info" | grep -q 'Signature=adhoc'

      - name: Verify macOS ARM64 package architecture
        if: matrix.os == 'macos-14'
        shell: bash
        run: |
          set -euo pipefail
          app_path="release/mac-arm64/MindDiary.app"
          main_binary="$app_path/Contents/MacOS/MindDiary"
          framework_binary="$app_path/Contents/Frameworks/Electron Framework.framework/Versions/A/Electron Framework"
          native_binary="$(find "$app_path" -type f -name 'better_sqlite3.node' -print -quit)"

          test -f "$main_binary"
          test -f "$framework_binary"
          test -n "$native_binary"

          {
            printf '%s\0' "$main_binary" "$framework_binary" "$native_binary"
            find "$app_path/Contents/Frameworks" -type f \( -path '*/Contents/MacOS/*' -o -name '*.dylib' -o -name '*.node' \) -print0
          } | while IFS= read -r -d '' binary; do
            architecture="$(file -b "$binary")"
            echo "$binary: $architecture"
            echo "$architecture" | grep -q 'arm64'
          done
