name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Rebuild SQLite for Node tests
        run: npm rebuild better-sqlite3

      - name: Type check
        run: npm run typecheck

      - name: Run unit tests
        run: npx vitest run

      - name: Build verification
        run: |
          npm run build:electron
          npx vite build

  build-verification:
    strategy:
      matrix:
        os: [windows-latest, macos-14]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Electron
        run: npm run build:electron

      - name: Build web app
        run: npx vite build

      - name: Prepare build resources
        run: npm run build:resources

      - name: Rebuild native dependencies for Electron
        if: matrix.os == 'windows-latest'
        run: npm run rebuild:electron

      - name: Verify Electron native dependencies
        if: matrix.os == 'windows-latest'
        run: npm run verify:electron-native

      - name: Package Windows app for native verification
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --dir --win --x64 --publish never

      - name: Verify packaged Electron native dependencies
        if: matrix.os == 'windows-latest'
        run: npm run verify:electron-native:packaged
